services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking
      POSTGRES_DB: banking_risk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://banking:banking@postgres:5432/banking_risk
    ports:
      - "8000:8000"

volumes:
  postgres_data:
